<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>অ্যাডমিন</title>
<style>
body{margin:0;font-family:"Noto Sans Bengali",Arial,sans-serif;background:#f3f6fb;padding:16px}
.wrap{max-width:900px;margin:auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
input{padding:10px;border:1px solid #c7cfdd;border-radius:8px;font-size:15px}
button{padding:9px 16px;border:0;border-radius:6px;background:#2f5597;color:#fff;cursor:pointer;font-family:inherit}
button.red{background:#c62828}button.green{background:#2e9d5b}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
th,td{padding:9px;border-bottom:1px solid #e3e8f0;text-align:left}th{background:#2f5597;color:#fff}
.tw{overflow-x:auto}.err{color:#c62828}.b{color:#c62828;font-weight:bold}.a{color:#2e7d32}.hide{display:none}
</style></head><body><div class="wrap">
<h2>অ্যাডমিন প্যানেল</h2>
<div id="lg"><input id="ap" type="password" placeholder="অ্যাডমিন পাসওয়ার্ড"> <button onclick="adm()">প্রবেশ</button> <span id="e" class="err"></span></div>
<div id="pn" class="hide">
 <p>ইমেইল ব্লক/আনব্লক:
 <input id="be" type="email" placeholder="email@example.com"> <button class="red" onclick="act('block',$('be').value)">ব্লক</button> <button class="green" onclick="act('unblock',$('be').value)">আনব্লক</button></p>
 <div class="tw"><table><thead><tr><th>User ID</th><th>Email</th><th>Status</th><th>Signup</th><th>Last Login</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
</div></div>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);let PW='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function adm(){PW=$('ap').value;const d=await api({action:'admin_list',admin_password:PW});
 if(d.ok){$('lg').classList.add('hide');$('pn').classList.remove('hide');draw(d.users);}else $('e').textContent=d.error||'সমস্যা';}
function draw(us){$('tb').innerHTML=us.map(u=>{const b=String(u.status).toLowerCase()=='blocked';
 return `<tr><td>${esc(u.id)}</td><td>${esc(u.email)}</td><td class="${b?'b':'a'}">${b?'Blocked':'Active'}</td><td>${esc(u.signup)}</td><td>${esc(u.last)}</td>
 <td><button class="${b?'green':'red'}" data-e="${esc(u.email)}" data-a="${b?'unblock':'block'}" onclick="act(this.dataset.a,this.dataset.e)">${b?'আনব্লক':'ব্লক'}</button></td></tr>`}).join('');}
async function act(a,email){const r=await api({action:'admin_'+a,admin_password:PW,email});
 if(!r.ok)alert(r.error);const d=await api({action:'admin_list',admin_password:PW});if(d.ok)draw(d.users);}
</script></body></html>
